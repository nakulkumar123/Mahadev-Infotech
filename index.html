<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Mahadev Infotech</title>
<style>
:root{--bg:#f4f7fb;--dark:#0b1220;--blue:#2563eb;--text:#101828;--muted:#667085;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer}.app{min-height:100vh}.top{background:linear-gradient(135deg,#0b1220,#172554);color:white;padding:18px 18px 22px;position:sticky;top:0;z-index:10}.toprow{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.65;margin-top:3px}.avatar{width:38px;height:38px;border-radius:12px;background:#ffffff18;display:grid;place-items:center}
main{max-width:850px;margin:auto;padding:18px 16px 90px}.screen{display:none}.screen.active{display:block}
.hero{padding:12px 2px 16px}.hero h1{margin:0;font-size:27px}.hero p{margin:7px 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:23px}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.tile{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;box-shadow:0 5px 18px #1018280a}.tile .ico{font-size:27px}.tile b{display:block;margin-top:10px;font-size:16px}.tile small{color:var(--muted);display:block;margin-top:4px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.back{background:transparent;border:0;color:var(--blue);font-weight:800;padding:6px 0;margin-bottom:6px}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.titleRow h2{margin:0}.primary{background:var(--blue);color:white;border:0;border-radius:12px;padding:12px 15px;font-weight:850}.secondary{background:#eef2f6;color:#101828;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.danger{background:#fee4e2;color:#b42318;border:0;border-radius:10px;padding:9px 12px;font-weight:800}
label{display:block;font-size:12px;font-weight:850;color:#475467;margin:13px 0 6px}input,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:11px;background:#fff;font-size:16px;outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}textarea{min-height:95px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;margin-top:15px}.actions>*{flex:1}
.laptop{display:flex;gap:13px;align-items:flex-start}.thumb{width:76px;height:76px;border-radius:12px;background:#eef2f6;object-fit:cover;flex:none}.laptop h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px;line-height:1.55}.price{font-weight:900;color:var(--blue);margin-left:auto}.listActions{display:flex;gap:8px;margin-top:12px}.empty{text-align:center;padding:35px 12px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px max(16px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));z-index:20}.navin{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{border:0;background:transparent;color:#667085;padding:6px;font-weight:750}.nav button.active{color:var(--blue)}
.photoGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.notice{background:#eff6ff;color:#1d4ed8;border-radius:12px;padding:11px;font-size:13px;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px 9px}.stat b{font-size:19px}.photoGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="logo">💻 Mahadev Infotech</div><div class="sub">Laptop Inventory Management</div></div><div class="avatar">MI</div></div></header>

<main>
<section id="dashboard" class="screen active">
<div class="hero"><h1>Dashboard</h1><p>Manage your laptop inventory from one place.</p></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total Laptops</span></div><div class="stat"><b id="withProblem">0</b><span>With Problem</span></div><div class="stat"><b id="photosCount">0</b><span>Photos</span></div></div>
<div class="menu">
<button class="tile" data-go="inventory"><div class="ico">💻</div><b>Laptops</b><small>View all laptop records</small></button>
<button class="tile" data-go="add"><div class="ico">➕</div><b>Add Laptop</b><small>Add a new laptop with photos</small></button>
<button class="tile" data-go="export"><div class="ico">📊</div><b>Excel Export</b><small>Export inventory as CSV</small></button>
</div>
</section>

<section id="inventory" class="screen">
<button class="back" data-go="dashboard">← Dashboard</button>
<div class="titleRow"><h2>Laptop Inventory</h2><button class="primary" data-go="add">＋ Add Laptop</button></div>
<div id="inventoryList"></div>
</section>

<section id="add" class="screen">
<button class="back" data-go="inventory">← Back to Laptops</button>
<div class="card"><h2 id="formHeading">Add Laptop</h2><div class="muted">Enter the laptop details below.</div>
<label>📷 Laptop Photos — up to 5</label><input id="photoInput" type="file" accept="image/*" multiple>
<div id="photoPreview" class="photoGrid"></div>
<div class="grid">
<div><label>RAM</label><input id="ram" placeholder="16 GB"></div>
<div><label>SSD</label><input id="ssd" placeholder="512 GB"></div>
<div><label>Display Size</label><input id="display" placeholder="15.6 inch"></div>
<div><label>Model</label><input id="model" placeholder="HP ProBook 440 G8"></div>
<div><label>Serial Number</label><input id="serial" placeholder="Enter serial number"></div>
<div><label>Price (₹)</label><input id="price" type="number" placeholder="25000"></div>
</div>
<label>⚠️ Problem / Issue</label><textarea id="problem" placeholder="What problem does the laptop have?"></textarea>
<div class="actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save Laptop</button></div>
</div>
</section>
</main>

<nav class="nav"><div class="navin"><button data-go="dashboard" class="active">⌂<br><small>Home</small></button><button data-go="inventory">💻<br><small>Laptops</small></button><button data-go="add">＋<br><small>Add</small></button></div></nav>
</div>

<script>
(function(){
const KEY="mahadev_infotech_final_v1";
let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
let editId=null, selectedPhotos=[];
const $=id=>document.getElementById(id);
function saveStore(){localStorage.setItem(KEY,JSON.stringify(items))}
function show(name){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 $(name).classList.add("active");
 document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("active",b.dataset.go===name && b.tagName==="BUTTON" && b.closest(".nav")));
 if(name==="dashboard")updateStats();
 if(name==="inventory")renderList();
 window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){e.preventDefault(); if(b.dataset.go==="export"){exportCSV();return} show(b.dataset.go)}});
$("photoInput").addEventListener("change",()=>{
 const files=Array.from($("photoInput").files).slice(0,5);
 Promise.all(files.map(f=>new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)}))).then(x=>{selectedPhotos=x;renderPreview()});
});
function renderPreview(){$("photoPreview").innerHTML=selectedPhotos.map(x=>`<img src="${x}">`).join("")}
$("save").addEventListener("click",()=>{
 if(!$("model").value.trim()){alert("Please enter the laptop model.");$("model").focus();return}
 const obj={id:editId||Date.now(),model:$("model").value.trim(),ram:$("ram").value.trim(),ssd:$("ssd").value.trim(),display:$("display").value.trim(),serial:$("serial").value.trim(),price:$("price").value.trim(),problem:$("problem").value.trim(),photos:selectedPhotos};
 if(editId)items=items.map(x=>x.id===editId?obj:x);else items.unshift(obj);
 saveStore();resetForm();show("inventory");
});
$("cancel").addEventListener("click",()=>{resetForm();show("inventory")});
function resetForm(){editId=null;selectedPhotos=[];$("photoInput").value="";renderPreview();["ram","ssd","display","model","serial","price","problem"].forEach(k=>$(k).value="");$("formHeading").textContent="Add Laptop"}
window.editLaptop=function(id){const x=items.find(a=>a.id===id);if(!x)return;editId=id;selectedPhotos=x.photos||[];["ram","ssd","display","model","serial","price","problem"].forEach(k=>$(k).value=x[k]||"");$("formHeading").textContent="Edit Laptop";renderPreview();show("add")}
window.deleteLaptop=function(id){if(confirm("Delete this laptop?")){items=items.filter(x=>x.id!==id);saveStore();renderList();updateStats()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderList(){
 const el=$("inventoryList");
 if(!items.length){el.innerHTML='<div class="card empty"><div style="font-size:38px">💻</div><b>No laptops added yet.</b><p>Tap “Add Laptop” to create your first record.</p></div>';return}
 el.innerHTML=items.map(x=>`<article class="card"><div class="laptop">
 <img class="thumb" src="${x.photos?.[0]||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2276%22 height=%2276%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23eef2f6%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 font-size=%2230%22%3E💻%3C/text%3E%3C/svg%3E'}">
 <div style="flex:1"><h3>${esc(x.model)}</h3><div class="meta">RAM: ${esc(x.ram||"—")} · SSD: ${esc(x.ssd||"—")}<br>Display: ${esc(x.display||"—")} · S/N: ${esc(x.serial||"—")}</div></div><div class="price">${x.price?"₹"+esc(x.price):"—"}</div></div>
 ${x.photos?.length?'<div class="photoGrid">'+x.photos.map(p=>`<img src="${p}">`).join("")+"</div>":""}
 <div class="notice"><b>Problem:</b> ${esc(x.problem||"No problem entered")}</div>
 <div class="listActions"><button class="secondary" onclick="editLaptop(${x.id})">Edit</button><button class="danger" onclick="deleteLaptop(${x.id})">Delete</button></div>
 </article>`).join("")
}
function updateStats(){$("total").textContent=items.length;$("withProblem").textContent=items.filter(x=>x.problem?.trim()).length;$("photosCount").textContent=items.reduce((n,x)=>n+(x.photos?.length||0),0)}
function exportCSV(){
 if(!items.length){alert("No laptops to export yet.");return}
 const rows=[["Model","RAM","SSD","Display Size","Serial Number","Price","Problem","Photo Count"],...items.map(x=>[x.model,x.ram,x.ssd,x.display,x.serial,x.price,x.problem,x.photos?.length||0])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Mahadev_Infotech_Inventory.csv";document.body.appendChild(a);a.click();a.remove()
}
updateStats();renderList();
})();
</script>
</body></html>
